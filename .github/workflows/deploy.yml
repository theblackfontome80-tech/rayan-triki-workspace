name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        run: |
          mkdir -p tmp out
          if ls *.zip >/dev/null 2>&1; then unzip -q -o '*.zip' -d tmp; fi
          SRC=$(dirname "$(find tmp -name index.html | head -1)")
          cp -r "$SRC"/. out/
          rm -f out/README.md
          echo "workspace.rayantriki.com" > out/CNAME
          ls -la out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
